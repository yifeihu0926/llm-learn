<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 700" role="img" aria-labelledby="v4-ops-title v4-ops-desc" style="font-family:'PingFang SC','Hiragino Sans GB',system-ui,sans-serif"><title id="v4-ops-title">vLLM DeepSeek V4 实际算子执行路径</title><desc id="v4-ops-desc">decoder 的 mHC、Attention、MoE 主链，展开 Attention 的投影、缓存、稀疏聚合和输出投影，说明 SWA、CSA、HCA 的索引生成差异。</desc><rect width="1080" height="700" fill="#08080d" rx="10"/><text x="34" y="40" fill="#9699ac" font-size="13">VLLM / DSV4 EXECUTION MAP</text><text x="34" y="85" fill="#e7e9f0" font-size="23">先看一个 decoder 循环</text><rect x="34" y="111" width="181" height="88" rx="7" fill="#0d0d15" stroke="#65c9e0"/><text x="51" y="142" fill="#65c9e0" font-size="18">Embedding</text><text x="51" y="174" fill="#9699ac" font-size="15">首层输入 [T,D]</text><path d="M215 156 H235 m-6 -4 l6 4 -6 4" fill="none" stroke="#30303d" stroke-width="1.6"/><rect x="241" y="111" width="181" height="88" rx="7" fill="#0d0d15" stroke="#78d6b1"/><text x="258" y="142" fill="#78d6b1" font-size="18">mHC pre</text><text x="258" y="174" fill="#9699ac" font-size="15">收缩 + Norm</text><path d="M422 156 H442 m-6 -4 l6 4 -6 4" fill="none" stroke="#30303d" stroke-width="1.6"/><rect x="448" y="111" width="181" height="88" rx="7" fill="#0d0d15" stroke="#65c9e0"/><text x="465" y="142" fill="#65c9e0" font-size="18">Attention</text><text x="465" y="174" fill="#9699ac" font-size="15">投影 / cache / 聚合</text><path d="M629 156 H649 m-6 -4 l6 4 -6 4" fill="none" stroke="#30303d" stroke-width="1.6"/><rect x="655" y="111" width="181" height="88" rx="7" fill="#0d0d15" stroke="#78d6b1"/><text x="672" y="142" fill="#78d6b1" font-size="18">mHC post/pre</text><text x="672" y="174" fill="#9699ac" font-size="15">回写 + 收缩 + Norm</text><path d="M836 156 H856 m-6 -4 l6 4 -6 4" fill="none" stroke="#30303d" stroke-width="1.6"/><rect x="862" y="111" width="181" height="88" rx="7" fill="#0d0d15" stroke="#efb568"/><text x="879" y="142" fill="#efb568" font-size="18">MoE</text><text x="879" y="174" fill="#9699ac" font-size="15">Router + experts</text><text x="34" y="232" fill="#9699ac" font-size="16">MoE 返回子层结果及 residual/mix；下一层开头融合回写，最后一层单独 mHC post。</text><text x="34" y="264" fill="#9699ac" font-size="16">末端：hc_head → RMSNorm → LM Head → logits；采样由 serving runner 另行调用。</text><path d="M34 291 H1046" stroke="#30303d"/><text x="34" y="333" fill="#e7e9f0" font-size="23">展开 Attention：三种模式共用所选聚合后端</text><rect x="34" y="361" width="232" height="86" rx="7" fill="#0d0d15" stroke="#65c9e0"/><text x="51" y="391" fill="#65c9e0" font-size="19">输入投影</text><text x="51" y="424" fill="#9699ac" font-size="15">低秩 Q / KV / Q heads</text><path d="M266 405 H288 m-6 -4 l6 4 -6 4" fill="none" stroke="#30303d" stroke-width="1.6"/><rect x="294" y="361" width="232" height="86" rx="7" fill="#0d0d15" stroke="#bba0e4"/><text x="311" y="391" fill="#bba0e4" font-size="19">Q / KV 准备</text><text x="311" y="424" fill="#9699ac" font-size="15">归一化 · RoPE · 写 cache</text><path d="M526 405 H548 m-6 -4 l6 4 -6 4" fill="none" stroke="#30303d" stroke-width="1.6"/><rect x="554" y="361" width="232" height="86" rx="7" fill="#0d0d15" stroke="#65c9e0"/><text x="571" y="391" fill="#65c9e0" font-size="19">Sparse MLA</text><text x="571" y="424" fill="#9699ac" font-size="15">FlashMLA / FlashInfer</text><path d="M786 405 H808 m-6 -4 l6 4 -6 4" fill="none" stroke="#30303d" stroke-width="1.6"/><rect x="814" y="361" width="232" height="86" rx="7" fill="#0d0d15" stroke="#efb568"/><text x="831" y="391" fill="#efb568" font-size="19">O 投影</text><text x="831" y="424" fill="#9699ac" font-size="15">逆 RoPE · O_a · O_b</text><text x="34" y="489" fill="#9699ac" font-size="18">局部与历史索引怎样产生</text><rect x="34" y="513" width="322" height="109" rx="7" fill="#0d0d15" stroke="#65c9e0"/><text x="52" y="544" fill="#65c9e0" font-size="20">SWA</text><text x="52" y="572" fill="#9699ac" font-size="15">配置 ratio 0 / 内部 ratio 1</text><text x="52" y="600" fill="#e7e9f0" font-size="15">局部窗口索引</text><rect x="379" y="513" width="322" height="109" rx="7" fill="#0d0d15" stroke="#bba0e4"/><text x="397" y="544" fill="#bba0e4" font-size="20">CSA</text><text x="397" y="572" fill="#9699ac" font-size="15">ratio = 4</text><text x="397" y="600" fill="#e7e9f0" font-size="15">局部窗口 + Indexer top-k 摘要</text><rect x="724" y="513" width="322" height="109" rx="7" fill="#0d0d15" stroke="#efb568"/><text x="742" y="544" fill="#efb568" font-size="20">HCA</text><text x="742" y="572" fill="#9699ac" font-size="15">ratio = 128</text><text x="742" y="600" fill="#e7e9f0" font-size="15">局部窗口 + 可见压缩摘要</text><text x="34" y="666" fill="#9699ac" font-size="15">融合粒度与 backend 受硬件、batch、cache dtype 和配置影响；图中框不等于一次 kernel launch。</text></svg>