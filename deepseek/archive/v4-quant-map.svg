<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 745" role="img" aria-labelledby="v4-map-title" style="font-family:'PingFang SC','Hiragino Sans GB',system-ui,sans-serif"><title id="v4-map-title">DeepSeek V4 混合精度组件地图：BF16 主干、FP8 Attention、FP4 Indexer、W4A8 路由专家和 W8A8 共享专家</title><defs><marker id="v4-map-arrow" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="none" stroke="#a0a9ba" stroke-width="1.2"/></marker></defs><rect width="1100" height="745" fill="#080a0f"/><text x="35" y="38" fill="#a0a9ba" font-size="15" >PRECISION MAP / 一个 V4 Transformer Block</text><text x="1060" y="38" fill="#78d6b1" font-size="13" text-anchor="end">点击模块查看计算路径</text><path d="M184 160H225 M530 160H575 M870 160H914" fill="none" stroke="#a0a9ba" stroke-width="1.5" marker-end="url(#v4-map-arrow)"/><g class="vq-hotspot" data-precision="stable" role="button" tabindex="0" aria-label="查看BF16 hidden精度路径"><rect x="35" y="92" width="145" height="136" rx="6" fill="#111620" stroke="#303642"/><path d="M35 104V216" stroke="#78d6b1" stroke-width="3"/><text x="53" y="123" fill="#78d6b1" font-size="20" >BF16 hidden</text><text x="53" y="150" fill="#a0a9ba" font-size="13" >Embedding / 残差</text><text x="53" y="183" fill="#e9edf4" font-size="15" >输入到子层</text><text x="53" y="207" fill="#e9edf4" font-size="15" >仍由 BF16 承载</text></g><g class="vq-hotspot" data-precision="attention" role="button" tabindex="0" aria-label="查看Attention精度路径"><rect x="230" y="92" width="300" height="136" rx="6" fill="#111620" stroke="#303642"/><path d="M230 104V216" stroke="#65c9e0" stroke-width="3"/><text x="248" y="123" fill="#65c9e0" font-size="20" >Attention</text><text x="248" y="150" fill="#a0a9ba" font-size="13" >主要投影 W8A8</text><text x="248" y="183" fill="#e9edf4" font-size="15" >FP8 投影 → BF16 Q/KV</text><text x="248" y="207" fill="#e9edf4" font-size="15" >QK / softmax 累加 FP32</text></g><g class="vq-hotspot" data-precision="routed" role="button" tabindex="0" aria-label="查看MoE精度路径"><rect x="580" y="92" width="290" height="136" rx="6" fill="#111620" stroke="#303642"/><path d="M580 104V216" stroke="#efb568" stroke-width="3"/><text x="598" y="123" fill="#efb568" font-size="20" >MoE</text><text x="598" y="150" fill="#a0a9ba" font-size="13" >路由专家 + 共享专家</text><text x="598" y="183" fill="#e9edf4" font-size="15" >按 token 选择专家</text><text x="598" y="207" fill="#e9edf4" font-size="15" >专家输出归并回 BF16</text></g><g class="vq-hotspot" data-precision="stable" role="button" tabindex="0" aria-label="查看BF16 残差精度路径"><rect x="920" y="92" width="145" height="136" rx="6" fill="#111620" stroke="#303642"/><path d="M920 104V216" stroke="#78d6b1" stroke-width="3"/><text x="938" y="123" fill="#78d6b1" font-size="20" >BF16 残差</text><text x="938" y="150" fill="#a0a9ba" font-size="13" >后续 Block</text><text x="938" y="183" fill="#e9edf4" font-size="15" >Norm / Head</text><text x="938" y="207" fill="#e9edf4" font-size="15" >保留高精度</text></g><path d="M380 228V246H214V524H230 M214 340H230 M725 228V246H562V524H580 M562 340H580" fill="none" stroke="#303642" stroke-width="1.5"/><g class="vq-hotspot" data-precision="kv" role="button" tabindex="0" aria-label="查看主 KV精度路径"><rect x="230" y="265" width="300" height="148" rx="6" fill="#111620" stroke="#303642"/><path d="M230 277V401" stroke="#65c9e0" stroke-width="3"/><text x="248" y="296" fill="#65c9e0" font-size="20" >主 KV</text><text x="248" y="323" fill="#a0a9ba" font-size="13" >窗口 KV + 压缩 KV</text><text x="248" y="356" fill="#e9edf4" font-size="15" >非 RoPE 448 维：FP8 / G64</text><text x="248" y="380" fill="#e9edf4" font-size="15" >RoPE 64 维：BF16</text><text x="248" y="404" fill="#e9edf4" font-size="15" >参考 cache：BF16 数组</text></g><g class="vq-hotspot" data-precision="routed" role="button" tabindex="0" aria-label="查看路由专家精度路径"><rect x="580" y="265" width="290" height="148" rx="6" fill="#111620" stroke="#303642"/><path d="M580 277V401" stroke="#efb568" stroke-width="3"/><text x="598" y="296" fill="#efb568" font-size="20" >路由专家</tex