<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 321" role="img" aria-labelledby="v4-qat-title" style="font-family:'PingFang SC','Hiragino Sans GB',system-ui,sans-serif"><title id="v4-qat-title">MXFP4专家QAT：FP32 master量化到FP4再转FP8训练，STE返回master；部署使用原生FP4</title><defs><marker id="v4-qat-arrow" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="none" stroke="#a0a9ba" stroke-width="1.2"/></marker></defs><rect width="1100" height="321" fill="#080a0f"/><text x="35" y="39" fill="#a0a9ba" font-size="15" >QUANTIZATION-AWARE TRAINING / 专家权重</text><rect x="35" y="90" width="170" height="91" rx="5" fill="#111620" stroke="#303642"/><text x="50" y="124" fill="#78d6b1" font-size="18" >FP32 master</text><text x="50" y="154" fill="#a0a9ba" font-size="13" >可更新的训练参数</text><path d="M208 136H233" stroke="#a0a9ba" fill="none" marker-end="url(#v4-qat-arrow)"/><rect x="240" y="90" width="175" height="91" rx="5" fill="#111620" stroke="#303642"/><text x="255" y="124" fill="#efb568" font-size="18" >MXFP4</text><text x="255" y="154" fill="#a0a9ba" font-size="13" >量化值与分组 scale</text><path d="M418 136H443" stroke="#a0a9ba" fill="none" marker-end="url(#v4-qat-arrow)"/><rect x="450" y="90" width="175" height="91" rx="5" fill="#111620" stroke="#303642"/><text x="465" y="124" fill="#65c9e0" font-size="18" >重编码到 FP8</text><text x="465" y="154" fill="#a0a9ba" font-size="13" >接入训练计算</text><path d="M628 136H653" stroke="#a0a9ba" fill="none" marker-end="url(#v4-qat-arrow)"/><rect x="660" y="90" width="170" height="91" rx="5" fill="#111620" stroke="#303642"/><text x="675" y="124" fill="#e9edf4" font-size="18" >前向计算</text><text x="675" y="154" fill="#a0a9ba" font-size="13" >损失与梯度</text><rect x="870" y="90" width="195" height="91" rx="5" fill="#111620" stroke="#303642"/><text x="885" y="124" fill="#efb568" font-size="18" >部署 / rollout</text><text x="885" y="154" fill="#a0a9ba" font-size="13" >原生 FP4 路径</text><path d="M745 184V245H120V187" stroke="#78d6b1" fill="none" stroke-dasharray="5 4" marker-end="url(#v4-qat-arrow)"/><text x="412" y="234" fill="#78d6b1" font-size="15" text-anchor="middle">反向 STE → master weights</text><path d="M327 88V67H967V87" fill="none" stroke="#efb568" marker-end="url(#v4-qat-arrow)"/><text x="733" y="59" fill="#efb568" font-size="12" text-anchor="middle">部署使用量化结果</text><text x="35" y="285" fill="#a0a9ba" font-size="14" >FP4 → FP8 重编码保留已量化权重值的条件：同一 FP8 tile 内的 scale 跨度满足报告要求。</text></svg>