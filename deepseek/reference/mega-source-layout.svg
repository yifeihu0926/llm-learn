<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 704" role="img" aria-labelledby="mega-source-layout-title mega-source-layout-desc" style="font-family:'PingFang SC','Hiragino Sans GB',system-ui,sans-serif"><title id="mega-source-layout-title">MegaMoE gate/up 八行交错和 scale UTCCP 重排</title><desc id="mega-source-layout-desc">gate 和 up 以八行为单位交错，scale 使用相同行序后，再在一百二十八行块内进行四乘三十二到三十二乘四的重排。</desc><rect width="1080" height="704" rx="10" fill="#08080d"/><text x="34" y="42" font-size="13" fill="#9295a7" >02 / ROW ORDER &amp; SCALE ORDER</text><text x="34" y="86" font-size="23" fill="#e7e9f0" >L1：按 8 行把 gate / up 配成对</text><text x="34" y="115" font-size="16" fill="#9295a7" >I = 32 的行序示意；每块代表 8 行，K 维内容保持不变。</text><text x="34" y="157" font-size="16" fill="#9295a7" >原来</text><text x="34" y="255" font-size="16" fill="#9295a7" >转换后</text><rect x="122" y="133" width="103" height="48" rx="7" fill="#0d0d14" stroke="#efb568"/><text x="173.5" y="163" font-size="15" fill="#efb568" text-anchor="middle">G0–7</text><rect x="236" y="133" width="103" height="48" rx="7" fill="#0d0d14" stroke="#efb568"/><text x="287.5" y="163" font-size="15" fill="#efb568" text-anchor="middle">G8–15</text><rect x="350" y="133" width="103" height="48" rx="7" fill="#0d0d14" stroke="#efb568"/><text x="401.5" y="163" font-size="15" fill="#efb568" text-anchor="middle">G16–23</text><rect x="464" y="133" width="103" height="48" rx="7" fill="#0d0d14" stroke="#efb568"/><text x="515.5" y="163" font-size="15" fill="#efb568" text-anchor="middle">G24–31</text><rect x="578" y="133" width="103" height="48" rx="7" fill="#0d0d14" stroke="#65c9e0"/><text x="629.5" y="163" font-size="15" fill="#65c9e0" text-anchor="middle">U0–7</text><rect x="692" y="133" width="103" height="48" rx="7" fill="#0d0d14" stroke="#65c9e0"/><text x="743.5" y="163" font-size="15" fill="#65c9e0" text-anchor="middle">U8–15</text><rect x="806" y="133" width="103" height="48" rx="7" fill="#0d0d14" stroke="#65c9e0"/><text x="857.5" y="163" font-size="15" fill="#65c9e0" text-anchor="middle">U16–23</text><rect x="920" y="133" width="103" height="48" rx="7" fill="#0d0d14" stroke="#65c9e0"/><text x="971.5" y="163" font-size="15" fill="#65c9e0" text-anchor="middle">U24–31</text><g data-layout-block="0"><rect x="122" y="231" width="103" height="48" rx="7" fill="#0d0d14" stroke="#efb568"/><text x="173.5" y="261" font-size="15" fill="#efb568" text-anchor="middle">G0–7</text></g><g data-layout-block="0"><rect x="236" y="231" width="103" height="48" rx="7" fill="#0d0d14" stroke="#65c9e0"/><text x="287.5" y="261" font-size="15" fill="#65c9e0" text-anchor="middle">U0–7</text></g><g data-layout-block="1"><rect x="350" y="231" width="103" height="48" rx="7" fill="#0d0d14" stroke="#efb568"/><text x="401.5" y="261" font-size="15" fill="#efb568" text-anchor="middle">G8–15</text></g><g data-layout-block="1"><rect x="464" y="231" width="103" height="48" rx="7" fill="#0d0d14" stroke="#65c9e0"/><text x="515.5" y="261" font-size="15" fill="#65c9e0" text-anchor="middle">U8–15</text></g><g data-layout-block="2"><rect x="578" y="231" width="103" height="48" rx="7" fill="#0d0d14" stroke="#efb568"/><text x="629.5" y="261" font-size="15" fill="#efb568" text-anchor="middle">G16–23</text></g><g data-layout-block="2"><rect x="692" y="231" width="103" height="48" rx="7" fill="#0d0d14" stroke="#65c9e0"/><text x="743.5" y="261" font-size="15" fill="#65c9e0" text-anchor="middle">U16–23</text></g><g data-layout-block="3"><rect x="806" y="231" width="103" height="48" rx="7" fill="#0d0d14" stroke="#efb568"/><text x="857.5" y="261" font-size="15" fill="#efb568" text-anchor="middle">G24–31</text></g><g data-layout-block="3"><rect x="920" y="231" width="103" height="48" rx="7" fill="#0d0d14" stroke="#65c9e0"/><text x="971.5" y="261" font-size="15" fill="#65c9e0" text-anchor="middle">U24–31</text></g><path d="M174 183 V228 M288 183 V205 H402 V228 M402 183 V201 H630 V228 M516 183 V197 H858 V228" fill="none" stroke="#efb568" stroke-opacity=".38"/><path d="M630 183 V209 H288 V228 M744 183 V213 H516 V228 M858 183 V217 H744 V228 M972 183 V228" fill="none" stroke="#65c9e0" stroke-opacity=".38"/><text x="122" y="310" font-size="16" fill="#9295a7" >data 与 L1 scale 先做同一行交错；否则量化权重会配上别行的 scale。</text><path d="M34 340 L1046 340" fill="none" stroke="#30303c" stroke-width="1.6" /><text x="34" y="385" font-size="23" fill="#e7e9f0" >Scale：每 128 行做 4 × 32 → 32 × 4</text><text x="34" y="413" font-size="16" fill="#9295a7" >以下 r 是完成 gate/up 交错后、UTCCP 重排之前的块内行号。</text><text x="34" y="458" font-size="16" fill="#bba0e4" >4 组，每组 32 行</text><rect x="34" y="476" width="240" height="32" rx="7" fill="#0d0d14" stroke="#30303c"/><text x="52" y="498" font-size="16" fill="#bba0e4" >r = 0 … 31</text><rect x="34" y="514" width="240" height="32" rx="7" fill="#0d0d14" stroke="#30303c"/><text x="52" y="536" font-size="16" fill="#bba0e4" >r = 32 … 63</text><rect x="34" y="552" width="240" height="32" rx="7" fill="#0d0d14" stroke="#30303c"/><text x="52" y="574" font-size="16" fill="#bba0e4" >r = 64 … 95</text><rect x="34" y="590" width="240" height="32" rx="7" fill="#0d0d14" stroke="#30303c"/><text x="52" y="612" font-size="16" fill="#bba0e4" >r = 96 … 127</text><path d="M295 548 L340 548" fill="none" stroke="#bba0e4" stroke-width="1.6" /><path d="M334 544 L340 548 L334 552" fill="none" stroke="#bba0e4" stroke-width="1.6"/><text x="350" y="466" font-size="16" fill="#bba0e4" >新物理排列</text><rect x="350" y="483" width="61" height="29" rx="7" fill="#0d0d14" stroke="#30303c"/><text x="380.5" y="504" font-size="15" fill="#bba0e4" text-anchor="middle">0</text><rect x="417" y="483" width="61" height="29" rx="7" fill="#0d0d14" stroke="#30303c"/><text x="447.5" y="504" font-size="15" fill="#bba0e4" text-anchor="middle">32</text><rect x="484" y="483" width="61" height="29" rx="7" fill="#0d0d14" stroke="#30303c"/><text x="514.5" y="504" font-size="15" fill="#bba0e4" text-anchor="middle">64</text><rect x="551" y="483" width="61" height="29" rx="7" fill="#0d0d14" stroke="#30303c"/><text x="581.5" y="504" font-size="15" fill="#bba0e4" text-anchor="middle">96</text><rect x="350" y="517" width="61" height="29" rx="7" fill="#0d0d14" stroke="#30303c"/><text x="380.5" y="538" font-size="15" fill="#bba0e4" text-anchor="middle">1</text><rect x="417" y="517" width="61" height="29" rx="7" fill="#0d0d14" stroke="#30303c"/><text x="447.5" y="538" font-size="15" fill="#bba0e4" text-anchor="middle">33</text><rect x="484" y="517" width="61" height="29" rx="7" fill="#0d0d14" stroke="#30303c"/><text x="514.5" y="538" font-size="15" fill="#bba0e4" text-anchor="middle">65</text><rect x="551" y="517" width="61" height="29" rx="7" fill="#0d0d14" stroke="#30303c"/><text x="581.5" y="538" font-size="15" fill="#bba0e4" text-anchor="middle">97</text><rect x="350" y="551" width="61" height="29" rx="7" fill="#0d0d14" stroke="#30303c"/><text x="380.5" y="572" font-size="15" fill="#bba0e4" text-anchor="middle">2</text><rect x="417" y="551" width="61" height="29" rx="7" fill="#0d0d14" stroke="#30303c"/><text x="447.5" y="572" font-size="15" fill="#bba0e4" text-anchor="middle">34</text><rect x="484" y="551" width="61" height="29" rx="7" fill="#0d0d14" stroke="#30303c"/><text x="514.5" y="572" font-size="15" fill="#bba0e4" text-anchor="middle">66</text><rect x="551" y="551" width="61" height="29" rx="7" fill="#0d0d14" stroke="#30303c"/><text x="581.5" y="572" font-size="15" fill="#bba0e4" text-anchor="middle">98</text><rect x="350" y="585" width="61" height="29" rx="7" fill="#0d0d14" stroke="#30303c"/><text x="380.5" y="606" font-size="15" fill="#bba0e4" text-anchor="middle">…</text><rect x="417" y="585" width="61" height="29" rx="7" fill="#0d0d14" stroke="#30303c"/><text x="447.5" y="606" font-size="15" fill="#bba0e4" text-anchor="middle">…</text><rect x="484" y="585" width="61" height="29" rx="7" fill="#0d0d14" stroke="#30303c"/><text x="514.5" y="606" font-size="15" fill="#bba0e4" text-anchor="middle">…</text><rect x="551" y="585" width="61" height="29" rx="7" fill="#0d0d14" stroke="#30303c"/><text x="581.5" y="606" font-size="15" fill="#bba0e4" text-anchor="middle">…</text><rect x="654" y="476" width="392" height="146" rx="7" fill="#0d0d14" stroke="#bba0e4"/><text x="675" y="509" font-size="17" fill="#bba0e4" >原行 r → 新物理行 p</text><text x="675" y="549" font-size="17" fill="#e7e9f0" >p = (r % 32) × 4 + ⌊r / 32⌋</text><text x="675" y="586" font-size="15" fill="#9295a7" >这改变 scale 行序，不改变 G = 32。</text><text x="34" y="670" font-size="16" fill="#9295a7" >8 = 分支交错粒度</text><text x="367" y="670" font-size="16" fill="#9295a7" >32 = K 维量化组长</text><text x="712" y="670" font-size="16" fill="#9295a7" >128 = scale 行重排块</text></svg>