<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 646" role="img" aria-labelledby="mega-source-chain-title mega-source-chain-desc" style="font-family:'PingFang SC','Hiragino Sans GB',system-ui,sans-serif"><title id="mega-source-chain-title">MegaMoE buffer 之后的调用链</title><desc id="mega-source-chain-desc">加载时转换专家权重，每轮传入输入路由和输出，经过 C++ 检查、TMA JIT host 启动一个融合 CUDA kernel。</desc><rect width="1080" height="646" rx="10" fill="#08080d"/><text x="34" y="42" font-size="13" fill="#9295a7" >01 / TWO PREPARATIONS, ONE KERNEL</text><text x="34" y="89" font-size="23" fill="#e7e9f0" >加载时：本地专家权重</text><text x="34" y="117" font-size="16" fill="#9295a7" >每层保存自己的布局转换结果；推理期间参数保持固定。</text><rect x="34" y="144" width="280" height="85" rx="7" fill="#0d0d14" stroke="#efb568"/><text x="54" y="174" font-size="19" fill="#efb568" >W_gate / W_up · W_down</text><text x="54" y="202" font-size="16" fill="#9295a7" >已量化 data + packed scale</text><path d="M314 185 L350 185" fill="none" stroke="#efb568" stroke-width="1.6" /><path d="M344 181 L350 185 L344 189" fill="none" stroke="#efb568" stroke-width="1.6"/><rect x="350" y="144" width="330" height="85" rx="7" fill="#0d0d14" stroke="#efb568"/><text x="370" y="174" font-size="17" fill="#efb568" >transform_weights_for_mega_moe</text><text x="370" y="202" font-size="16" fill="#9295a7" >L1 行交错；L1 / L2 scale 重排</text><path d="M680 185 L715 185" fill="none" stroke="#efb568" stroke-width="1.6" /><path d="M709 181 L715 185 L709 189" fill="none" stroke="#efb568" stroke-width="1.6"/><rect x="715" y="144" width="331" height="85" rx="7" fill="#0d0d14" stroke="#efb568"/><text x="735" y="174" font-size="19" fill="#efb568" >l1_ready / l2_ready</text><text x="735" y="202" font-size="16" fill="#9295a7" >独立于 symmetric buffer 的权重</text><text x="34" y="280" font-size="23" fill="#e7e9f0" >每轮：T 个有效 token</text><text x="34" y="307" font-size="16" fill="#9295a7" >Router 与输入量化由调用者完成；y 的第一维决定本轮 T。</text><g data-chain-stage="0"><rect x="34" y="337" width="232" height="104" rx="7" fill="#0d0d14" stroke="#65c9e0"/><text x="52" y="367" font-size="19" fill="#65c9e0" >01 · Python</text><text x="52" y="397" font-size="16" fill="#e7e9f0" >填 x / scale / routes</text><text x="52" y="423" font-size="14" fill="#9295a7" >传 y 与 prepared weights</text></g><path d="M266 389 L290 389" fill="none" stroke="#65c9e0" stroke-width="1.6" /><path d="M284 385 L290 389 L284 393" fill="none" stroke="#65c9e0" stroke-width="1.6"/><g data-chain-stage="1"><rect x="294" y="337" width="232" height="104" rx="7" fill="#0d0d14" stroke="#65c9e0"/><text x="312" y="367" font-size="19" fill="#65c9e0" >02 · C++ API</text><text x="312" y="397" font-size="16" fill="#e7e9f0" >T = y.size(0)</text><text x="312" y="423" font-size="14" fill="#9295a7" >检查配置；切 buffer views</text></g><path d="M526 389 L550 389" fill="none" stroke="#65c9e0" stroke-width="1.6" /><path d="M544 385 L550 389 L544 393" fill="none" stroke="#65c9e0" stroke-width="1.6"/><g data-chain-stage="2"><rect x="554" y="337" width="232" height="104" rx="7" fill="#0d0d14" stroke="#bba0e4"/><text x="572" y="367" font-size="19" fill="#bba0e4" >03 · SM100 host</text><text x="572" y="397" font-size="16" fill="#e7e9f0" >tile + TMA + JIT</text><text x="572" y="423" font-size="14" fill="#9295a7" >2-CTA cluster launch</text></g><path d="M786 389 L810 389" fill="none" stroke="#bba0e4" stroke-width="1.6" /><path d="M804 385 L810 389 L804 393" fill="none" stroke="#bba0e4" stroke-width="1.6"/><g data-chain-stage="3"><rect x="814" y="337" width="232" height="104" rx="7" fill="#0d0d14" stroke="#78d6b1"/><text x="832" y="367" font-size="19" fill="#78d6b1" >04 · CUDA kernel</text><text x="832" y="397" font-size="16" fill="#e7e9f0" >persistent task stream</text><text x="832" y="423" font-size="14" fill="#9295a7" >通信 / MMA / epilogue</text></g><path d="M880 229 V318 H151 V337" fill="none" stroke="#efb568" stroke-width="1.5" stroke-dasharray="5 5"/><path d="M145 331 L151 337 L157 331" fill="none" stroke="#efb568" stroke-width="1.5"/><text x="34" y="485" font-size="18" fill="#78d6b1" >kernel 内同时推进不同 tile</text><rect x="34" y="510" width="232" height="74" rx="7" fill="#0d0d14" stroke="#30303c"/><text x="52" y="539" font-size="17" fill="#65c9e0" >dispatch</text><text x="52" y="565" font-size="15" fill="#9295a7" >metadata / pull</text><rect x="294" y="510" width="232" height="74" rx="7" fill="#0d0d14" stroke="#30303c"/><text x="312" y="539" font-size="17" fill="#bba0e4" >loaders + MMA</text><text x="312" y="565" font-size="15" fill="#9295a7" >A / B / scale / GEMM</text><rect x="554" y="510" width="232" height="74" rx="7" fill="#0d0d14" stroke="#30303c"/><text x="572" y="539" font-size="17" fill="#efb568" >L1 epilogue</text><text x="572" y="565" font-size="15" fill="#9295a7" >SwiGLU → FP8</text><rect x="814" y="510" width="232" height="74" rx="7" fill="#0d0d14" stroke="#30303c"/><text x="832" y="539" font-size="17" fill="#78d6b1" >L2 / combine</text><text x="832" y="565" font-size="15" fill="#9295a7" >BF16 slots → y</text><text x="34" y="615" font-size="15" fill="#9295a7" >箭头表示调用与数据依赖；下方角色并行工作，不是四次顺序 kernel launch。</text></svg>